name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Aggregate validation
        run: |
          set -o pipefail
          npm run ci 2>&1 | tee ci-output.txt
          CI_EXIT=$?
          echo "### Build size baseline" >> $GITHUB_STEP_SUMMARY
          echo "Date: $(date -u)" >> $GITHUB_STEP_SUMMARY
          if [[ -d dist ]]; then
            DIST_SIZE=$(du -sh dist | cut -f1)
            echo "- dist: $DIST_SIZE" >> $GITHUB_STEP_SUMMARY
          fi
          if [[ -d dist-web ]]; then
            WEB_SIZE=$(du -sh dist-web | cut -f1)
            echo "- dist-web: $WEB_SIZE" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Build warnings (if any):" >> $GITHUB_STEP_SUMMARY
          grep -E "warning|error" ci-output.txt | head -20 >> $GITHUB_STEP_SUMMARY || true
          exit $CI_EXIT